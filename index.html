<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>카드섹션 시뮬레이터</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- 상단 메뉴 -->
  <header class="topbar">
    <div class="menu">
      <button id="btnManage" class="btn">🗂 이미지 관리</button>
      <button id="btnManageAudio" class="btn">🎵 음원 관리</button>
      <label class="btn btn-accent">
        ＋ 이미지 추가
        <input id="inputImages" type="file" accept="image/*" multiple hidden>
      </label>
      <label class="btn btn-accent">
        ＋ 음원 추가
        <input id="inputAudio" type="file" accept="audio/*" multiple hidden>
      </label>
    </div>
    <h1 class="title">카드섹션 시뮬레이터</h1>
    <div class="info">
      <span>현재 곡 이름 : <b id="songName">없음</b></span>
      <span>장수 <b id="frameCounter">0 / 0</b></span>
    </div>
  </header>

  <!-- 무대 -->
  <main class="stage-wrap">
    <div class="stage" id="stage">
      <canvas id="canvas"></canvas>
      <div class="row-controls" id="rowControls"></div>
      <p class="empty-msg" id="emptyMsg" hidden>
        이미지가 없어요. <b>＋ 이미지 추가</b>를 누르거나<br>
        <code>assets/images</code> 폴더에 이미지를 넣고 <code>assets/config.js</code>에 적어주세요.
      </p>
    </div>
  </main>

  <!-- 하단 조작 바 -->
  <footer class="bottombar">
    <div class="frame-ctrl">
      <button id="btnFirst" class="icon-btn" title="처음 장면 (Home)">⏮</button>
      <button id="btnPrev" class="icon-btn" title="이전 장면 (←)">◀</button>
      <input id="frameSlider" type="range" min="1" max="1" value="1">
      <button id="btnNext" class="icon-btn" title="다음 장면 (→)">▶</button>
      <button id="btnLast" class="icon-btn" title="마지막 장면 (End)">⏭</button>
    </div>
    <div class="audio-ctrl">
      <button id="btnPlay" class="icon-btn play" title="재생 / 일시정지 (스페이스바)">▶</button>
      <span id="timeNow">0:00</span>
      <input id="audioSlider" type="range" min="0" max="0" value="0" step="0.1">
      <span id="timeTotal">0:00</span>
    </div>
    <div class="view-ctrl">
      <label title="스케치북에 그림을 맞추는 방식">
        맞춤
        <select id="fitMode">
          <option value="stretch">늘리기</option>
          <option value="contain">전체 보기</option>
          <option value="cover">꽉 채우기</option>
        </select>
      </label>
      <label title="간격 없이 모아서 완성된 그림을 확인해요"><input id="togglePacked" type="checkbox"> 붙여보기</label>
      <label><input id="toggleHands" type="checkbox" checked> 손 보이기</label>
      <button id="btnFullscreen" class="icon-btn" title="전체화면 (F)">⛶</button>
    </div>
  </footer>

  <!-- 이미지 관리 창 -->
  <div class="modal" id="manageModal" hidden>
    <div class="modal-box">
      <div class="modal-head">
        <h2>이미지 관리</h2>
        <button class="icon-btn modal-close">✕</button>
      </div>
      <h3>장면 이미지 <small>(위에서부터 1장, 2장 …)</small></h3>
      <ul class="item-list" id="imageList"></ul>
      <h3>인원 설정</h3>
      <div class="row-setting">
        <button id="btnAddRow" class="btn">＋ 줄 추가</button>
        <button id="btnRemoveRow" class="btn">－ 줄 삭제</button>
        <button id="btnResetRows" class="btn">기본값(6·5·6)으로</button>
      </div>
    </div>
  </div>

  <!-- 음원 관리 창 -->
  <div class="modal" id="audioModal" hidden>
    <div class="modal-box">
      <div class="modal-head">
        <h2>음원 관리</h2>
        <button class="icon-btn modal-close">✕</button>
      </div>
      <h3>음원 목록 <small>(누르면 그 곡으로 바뀌어요)</small></h3>
      <ul class="item-list" id="audioList"></ul>
      <div class="row-setting" style="margin-top:12px">
        <label class="btn btn-accent">
          ＋ 음원 추가
          <input id="inputAudio2" type="file" accept="audio/*" multiple hidden>
        </label>
      </div>
    </div>
  </div>

  <audio id="audio" preload="auto"></audio>

  <!-- 기본 이미지·음원 목록 -->
  <script src="assets/config.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
